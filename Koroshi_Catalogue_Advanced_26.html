<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOROSHI — Order Form</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--black:#010001;--white:#fff;--light:#f8f8f8;--mid:#e8e8e8;--dark:#3a3a3a;
      --gold:#c9a961;--muted:#6a6a6a;--k08:#E8A945;--wh:#4FA3D1;--danger:#c0392b}
body{font-family:'Montserrat',sans-serif;background:#f0f0f0;color:var(--black);padding-bottom:80px}

/* HEADER */
header{background:var(--white);border-bottom:1px solid var(--mid);padding:.7rem 2rem;
        position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:2rem;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.logo-wrap svg{height:30px;width:auto}
.header-tag{font-size:.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-left:auto}

/* NAV */
.nav{background:var(--white);border-bottom:1px solid var(--mid);padding:.5rem 2rem;
      position:sticky;top:50px;z-index:99;display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}
.gbtn{padding:.38rem .85rem;border:none;background:transparent;color:var(--muted);cursor:pointer;
       font-weight:600;font-size:.73rem;text-transform:uppercase;letter-spacing:1px;
       border-bottom:2px solid transparent;font-family:inherit;transition:color .15s}
.gbtn.active{color:var(--black);border-bottom-color:var(--gold)}
.fam-wrap{margin-left:auto;position:relative}
.fbtn{padding:.38rem .85rem;border:1px solid var(--mid);background:var(--light);cursor:pointer;
       font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;border-radius:2px;font-family:inherit}
.fbtn:hover{border-color:var(--gold)}
.fmenu{position:absolute;top:calc(100% + 3px);right:0;background:var(--white);border:1px solid var(--mid);
        border-radius:2px;max-height:340px;overflow-y:auto;z-index:200;display:none;min-width:220px;
        box-shadow:0 6px 20px rgba(0,0,0,.12)}
.fmenu.open{display:block}
.fopt{padding:.55rem 1rem;border-bottom:1px solid var(--mid);cursor:pointer;font-size:.76rem;
       display:flex;justify-content:space-between;align-items:center;transition:background .1s}
.fopt:hover{background:var(--light)}
.fopt.active{color:var(--gold);font-weight:700}

/* TOOLBAR */
.toolbar{background:var(--white);border-bottom:1px solid var(--mid);padding:.6rem 2rem;
          display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;
          position:sticky;top:90px;z-index:98;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sinput{flex:1;min-width:160px;padding:.55rem .85rem;border:1px solid var(--mid);
         background:var(--light);font-size:.83rem;font-family:inherit;border-radius:2px}
.sinput:focus{outline:none;border-color:var(--gold);background:var(--white)}
.tbtn{padding:.55rem .9rem;border:none;cursor:pointer;font-weight:700;font-size:.67rem;
       text-transform:uppercase;letter-spacing:.5px;font-family:inherit;border-radius:2px;white-space:nowrap}
.btn-reset{background:var(--light);color:var(--dark);border:1px solid var(--mid)}
.btn-restore{background:#666;color:#fff}
.btn-delete{background:var(--danger);color:#fff}
.btn-export{background:var(--gold);color:var(--black);font-weight:800;margin-left:auto}
.sel-info{font-size:.73rem;color:var(--muted);white-space:nowrap}
.sel-info b{color:var(--gold);font-family:'Poppins',sans-serif;font-size:.9rem}

/* STATS */
.stats{display:flex;gap:2rem;padding:1rem 2rem;background:var(--white);border-bottom:1px solid var(--mid)}
.stat .n{font-family:'Poppins',sans-serif;font-size:1.25rem;font-weight:700;color:var(--gold)}
.stat .l{font-size:.56rem;text-transform:uppercase;color:var(--muted);letter-spacing:1px}

/* SECTION HEADER */
.sec-hdr{display:flex;align-items:center;gap:.6rem;margin:1.3rem 1.5rem .65rem;
          padding:.55rem .85rem;background:var(--white);border:1px solid var(--mid);border-radius:3px}
.sec-name{font-family:'Poppins',sans-serif;font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;flex:1}
.sec-cnt{font-size:.63rem;color:var(--muted)}
.sbtn{padding:.26rem .6rem;border:none;cursor:pointer;font-size:.6rem;font-weight:700;
       text-transform:uppercase;letter-spacing:.5px;border-radius:2px;font-family:inherit}
.sbtn-sel{background:var(--light);color:var(--dark);border:1px solid var(--mid)}
.sbtn-sel.all{background:rgba(201,169,97,.18);border-color:var(--gold);color:#8a6d1a}
.sbtn-del{background:var(--danger);color:#fff}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;padding:0 1.5rem 1rem}

/* CARD */
.card{background:var(--white);border:2px solid var(--mid);display:flex;flex-direction:column;
       border-radius:3px;cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#bbb;box-shadow:0 3px 12px rgba(0,0,0,.07)}
.card.sel{border-color:var(--gold);background:rgba(201,169,97,.04)}

/* CHECKBOX */
.chk{position:absolute;top:7px;left:7px;width:22px;height:22px;border-radius:50%;
      background:rgba(255,255,255,.92);border:2px solid rgba(0,0,0,.18);
      display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;
      z-index:20;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:all .15s}
.card.sel .chk{background:var(--gold);border-color:var(--gold);color:#fff}

/* IMAGE */
.img-wrap{position:relative;aspect-ratio:3/4;background:var(--light);overflow:hidden;border-radius:2px 2px 0 0}
.img-wrap img{width:100%;height:100%;object-fit:cover;display:none;position:absolute;top:0;left:0;pointer-events:none}
.img-wrap img.on{display:block}
.no-img{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;color:var(--muted)}
.img-link{position:absolute;bottom:7px;right:7px;background:rgba(0,0,0,.6);color:#fff;
           width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
           font-size:11px;z-index:15;text-decoration:none;opacity:0;transition:opacity .2s}
.card:hover .img-link{opacity:1}
.img-link:hover{background:var(--gold);color:var(--black)}
.c-arrows{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;
           padding:0 6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.card:hover .c-arrows{opacity:1;pointer-events:all}
.arr{background:rgba(0,0,0,.4);color:#fff;border:none;width:26px;height:26px;border-radius:50%;
      cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.c-dots{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);display:flex;gap:3px;z-index:10;pointer-events:all}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;border:1px solid rgba(255,255,255,.6)}
.dot.on{background:#fff;width:8px}

/* INFO */
.info{padding:.85rem;display:flex;flex-direction:column;gap:.55rem}
.art-row{display:flex;justify-content:space-between;align-items:flex-start;gap:.3rem}
.art-id{font-family:'Poppins',sans-serif;font-size:.85rem;font-weight:700}
.col-badge{padding:.15rem .45rem;background:var(--mid);border-radius:2px;font-size:.58rem;font-weight:700}
.descri{font-size:.62rem;color:var(--muted);line-height:1.35}

/* STOCK SUMMARY (compact, always visible) */
.stk-summary{display:flex;gap:.4rem}
.stk-pill{flex:1;padding:.35rem .5rem;border-radius:3px;text-align:center}
.stk-pill.k{background:rgba(232,169,69,.12);border:1px solid rgba(232,169,69,.3)}
.stk-pill.w{background:rgba(79,163,209,.12);border:1px solid rgba(79,163,209,.3)}
.stk-pill .pn{font-family:'Poppins',sans-serif;font-size:.9rem;font-weight:700}
.stk-pill.k .pn{color:var(--k08)}
.stk-pill.w .pn{color:var(--wh)}
.stk-pill .pl{font-size:.52rem;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}

/* SIZE TABLE — always visible */
.size-tbl{width:100%;border-collapse:collapse;font-size:.62rem;border:1px solid var(--mid);border-radius:3px;overflow:hidden}
.size-tbl thead th{background:var(--black);color:rgba(255,255,255,.7);padding:.28rem .3rem;text-align:center;font-size:.55rem;text-transform:uppercase;font-weight:700}
.size-tbl thead th.k-col{color:var(--k08)}
.size-tbl thead th.w-col{color:var(--wh)}
.size-tbl thead th.q-col{color:#fff}
.size-tbl tbody tr:nth-child(even){background:var(--light)}
.size-tbl td{padding:.26rem .3rem;text-align:center;border-bottom:1px solid var(--mid)}
.td-sz{font-weight:700;color:var(--dark)}
.td-k{color:var(--k08);font-weight:600}
.td-w{color:var(--wh);font-weight:600}

/* QTY PER SIZE — hidden until selected */
.qty-size-input{width:38px;height:22px;border:1px solid var(--mid);text-align:center;
                 font-family:'Poppins',sans-serif;font-size:.75rem;font-weight:700;
                 border-radius:2px;color:var(--muted);background:var(--white);display:none}
.card.sel .qty-size-input{display:block;border-color:var(--gold);color:var(--gold)}
.card.sel .qty-size-input:focus{outline:none;background:rgba(201,169,97,.08)}

/* BOTTOM BAR */
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:2px solid var(--gold);
         padding:.65rem 2rem;display:flex;gap:1.5rem;align-items:center;z-index:300;flex-wrap:wrap;
         box-shadow:0 -2px 10px rgba(0,0,0,.07)}
.tot .n{font-family:'Poppins',sans-serif;font-size:1rem;font-weight:700;color:var(--gold)}
.tot .l{font-size:.54rem;text-transform:uppercase;color:var(--muted);letter-spacing:1px}
.no-results{text-align:center;padding:3rem;color:var(--muted)}
footer{background:var(--black);color:rgba(255,255,255,.3);text-align:center;padding:1rem;
        font-size:.65rem;letter-spacing:1px;text-transform:uppercase;margin-top:2rem}
</style>
</head>

8_000015_9.jpg?v=1760531749"]}];
const GENDERS = ['HOMBRE','MUJER','GIRL','BOY','UNISEX'].filter(g => CAT.some(i => i.sexo === g));

// STATE
const S = {
  gender: GENDERS[0],
  family: null,
  search: '',
  removed: new Set(),
  selected: new Map()  // key -> { size -> qty }
};

// BOOT
window.addEventListener('DOMContentLoaded', () => {
  const nav = document.getElementById('nav');
  const famWrap = nav.querySelector('.fam-wrap');
  GENDERS.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'gbtn' + (g === S.gender ? ' active' : '');
    btn.textContent = g;
    btn.addEventListener('click', () => setGender(g));
    nav.insertBefore(btn, famWrap);
  });
  document.getElementById('fbtn').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('fmenu').classList.toggle('open');
  });
  document.addEventListener('click', () => document.getElementById('fmenu').classList.remove('open'));
  document.getElementById('search').addEventListener('input', e => { S.search = e.target.value.trim(); render(); });
  document.getElementById('content').addEventListener('click', handleClick);
  document.getElementById('content').addEventListener('input', handleInput);
  renderStats(); buildFamMenu(); render();
});

// INPUT DELEGATION (qty inputs)
function handleInput(e) {
  if (e.target.classList.contains('qty-size-input')) {
    e.stopPropagation();
    const key  = e.target.dataset.key;
    const size = e.target.dataset.size;
    const val  = e.target.value;
    if (!S.selected.has(key)) return;
    const n = Math.max(0, parseInt(val) || 0);
    const sizeMap = S.selected.get(key);
    if (n === 0) delete sizeMap[size];
    else sizeMap[size] = n;
    updateToolbar();
  }
}

// CLICK DELEGATION
function handleClick(e) {
  if (e.target.classList.contains('arr')) {
    e.stopPropagation();
    const w = e.target.closest('.img-wrap');
    carouselMove(w, e.target.dataset.dir === 'next' ? 1 : -1);
    return;
  }
  if (e.target.classList.contains('dot')) {
    e.stopPropagation();
    carouselGoto(e.target.closest('.img-wrap'), +e.target.dataset.i);
    return;
  }
  if (e.target.classList.contains('img-link') || e.target.closest('.img-link')) { e.stopPropagation(); return; }
  if (e.target.classList.contains('qty-size-input')) { e.stopPropagation(); return; }
  if (e.target.classList.contains('sbtn-sel')) { e.stopPropagation(); selectCategory(e.target.dataset.fam); return; }
  if (e.target.classList.contains('sbtn-del')) { e.stopPropagation(); removeCategory(e.target.dataset.fam); return; }
  const card = e.target.closest('.card');
  if (card) toggleCard(card.dataset.key);
}

// FILTERS
function setGender(g) {
  S.gender = g; S.family = null; S.search = '';
  document.getElementById('search').value = '';
  document.querySelectorAll('.gbtn').forEach(b => b.classList.toggle('active', b.textContent === g));
  buildFamMenu(); render();
}
function buildFamMenu() {
  const items = CAT.filter(i => i.sexo === S.gender && !S.removed.has(i.key));
  const fams = [...new Set(items.map(i => i.familia))].sort();
  const menu = document.getElementById('fmenu');
  menu.innerHTML = '';
  const makeOpt = (label, cnt, fam) => {
    const d = document.createElement('div');
    d.className = 'fopt' + (S.family === fam ? ' active' : '');
    d.innerHTML = `<span>${label}</span><span style="font-size:.64rem;color:var(--muted)">${cnt}</span>`;
    d.addEventListener('click', () => { S.family = fam; menu.classList.remove('open'); buildFamMenu(); render(); });
    menu.appendChild(d);
  };
  makeOpt('Todas las familias', items.length, null);
  fams.forEach(f => makeOpt(f, items.filter(i => i.familia === f).length, f));
}
function resetFilters() { S.family = null; S.search = ''; document.getElementById('search').value = ''; buildFamMenu(); render(); }
function getFiltered() {
  let items = CAT.filter(i => i.sexo === S.gender && !S.removed.has(i.key));
  if (S.family) items = items.filter(i => i.familia === S.family);
  if (S.search) {
    const q = S.search.toLowerCase();
    items = items.filter(i => i.articulo.toLowerCase().includes(q) || i.color.includes(q) ||
      i.familia.toLowerCase().includes(q) || (i.descri_art||'').toLowerCase().includes(q) ||
      (i.descri_col||'').toLowerCase().includes(q));
  }
  return items;
}

// SELECTION
function toggleCard(key) {
  if (S.selected.has(key)) S.selected.delete(key);
  else S.selected.set(key, {});
  const card = document.querySelector(`.card[data-key="${key}"]`);
  if (card) refreshCard(card, key);
  updateToolbar();
}
function selectCategory(fam) {
  const items = getFiltered().filter(i => i.familia === fam);
  const allSel = items.length > 0 && items.every(i => S.selected.has(i.key));
  items.forEach(i => { if (allSel) S.selected.delete(i.key); else if (!S.selected.has(i.key)) S.selected.set(i.key, {}); });
  items.forEach(i => { const c = document.querySelector(`.card[data-key="${i.key}"]`); if (c) refreshCard(c, i.key); });
  const btn = document.querySelector(`.sbtn-sel[data-fam="${CSS.escape(fam)}"]`);
  if (btn) { const na = items.every(i => S.selected.has(i.key)); btn.textContent = na ? '✓ Todos' : '☐ Seleccionar todos'; btn.classList.toggle('all', na); }
  updateToolbar();
}
function refreshCard(card, key) {
  const isSel = S.selected.has(key);
  card.classList.toggle('sel', isSel);
  const chk = card.querySelector('.chk');
  if (chk) chk.textContent = isSel ? '✓' : '';
}
function removeSelected() { S.selected.forEach((_,k) => S.removed.add(k)); S.selected.clear(); buildFamMenu(); render(); updateToolbar(); }
function removeCategory(fam) {
  getFiltered().filter(i => i.familia === fam).forEach(i => { S.removed.add(i.key); S.selected.delete(i.key); });
  buildFamMenu(); render(); updateToolbar();
}
function restoreAll() { S.removed.clear(); S.selected.clear(); buildFamMenu(); render(); updateToolbar(); }

function totalOrderedUnits() {
  let t = 0;
  S.selected.forEach((sizes) => { Object.values(sizes).forEach(v => t += (+v||0)); });
  return t;
}
function updateToolbar() {
  const hasSel = S.selected.size > 0;
  const hasRem = S.removed.size > 0;
  const units = totalOrderedUnits();
  document.getElementById('selInfo').style.display   = hasSel ? '' : 'none';
  document.getElementById('selN').textContent         = S.selected.size;
  document.getElementById('selUnits').textContent     = units.toLocaleString();
  document.getElementById('btnDel').style.display     = hasSel ? '' : 'none';
  document.getElementById('btnRestore').style.display = hasRem ? '' : 'none';
  document.getElementById('removedN').textContent     = S.removed.size;
  document.getElementById('btnExport').style.display  = hasSel ? '' : 'none';
  document.getElementById('orderTot').style.display   = hasSel ? '' : 'none';
  document.getElementById('orderN').textContent       = units.toLocaleString();
}

// EXPORT — one row per size per article
function exportCSV() {
  const rows = [['Articulo','Color','Descripcion Articulo','Descripcion Color','Familia','Sexo','Talla','Cantidad Pedida','K08 Stock','WH Stock']];
  S.selected.forEach((sizeQtys, key) => {
    const item = CAT.find(i => i.key === key);
    if (!item) return;
    const sizes = getSizes(item.stock_k08, item.stock_warehouse);
    sizes.forEach(sz => {
      const qty = +sizeQtys[sz] || 0;
      if (qty === 0) return; // skip sizes with 0
      rows.push([
        item.articulo, item.color, item.descri_art, item.descri_col,
        item.familia, item.sexo, sz, qty,
        item.stock_k08[sz] || 0, item.stock_warehouse[sz] || 0
      ]);
    });
  });
  if (rows.length === 1) { alert('No hay cantidades introducidas todavía.'); return; }
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v||'').replace(/"/g,'""') + '"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'koroshi_pedido_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

// RENDER
function renderStats() {
  const k = CAT.reduce((a,i) => a + Object.values(i.stock_k08||{}).reduce((x,y)=>x+y,0), 0);
  const w = CAT.reduce((a,i) => a + Object.values(i.stock_warehouse||{}).reduce((x,y)=>x+y,0), 0);
  document.getElementById('stats').innerHTML =
    `<div class="stat"><div class="n">${CAT.length}</div><div class="l">Referencias</div></div>
     <div class="stat"><div class="n" style="color:var(--k08)">${k.toLocaleString()}</div><div class="l">K08 Stock</div></div>
     <div class="stat"><div class="n" style="color:var(--wh)">${w.toLocaleString()}</div><div class="l">WH Stock</div></div>
     <div class="stat"><div class="n">${(k+w).toLocaleString()}</div><div class="l">Total Stock</div></div>`;
}

function getSizes(k08, wh) {
  return [...new Set([...Object.keys(k08||{}), ...Object.keys(wh||{})])]
    .sort((a,b) => (SIZE_ORDER.indexOf(a)<0?999:SIZE_ORDER.indexOf(a)) - (SIZE_ORDER.indexOf(b)<0?999:SIZE_ORDER.indexOf(b)));
}

function renderCard(item) {
  const imgs = item.images || [];
  const k08 = item.stock_k08 || {};
  const wh  = item.stock_warehouse || {};
  const k08t = Object.values(k08).reduce((a,b)=>a+b,0);
  const wht  = Object.values(wh).reduce((a,b)=>a+b,0);
  const isSel = S.selected.has(item.key);
  const sizeQtys = S.selected.get(item.key) || {};
  const sizes = getSizes(k08, wh);

  // Carousel
  let imgHtml = '';
  if (imgs.length) {
    imgHtml = imgs.map((u,i) => `<img src="${u}" class="${i===0?'on':''}" loading="${i===0?'eager':'lazy'}">`).join('');
    if (imgs.length > 1) {
      imgHtml += `<div class="c-arrows"><button class="arr" data-dir="prev">‹</button><button class="arr" data-dir="next">›</button></div>`;
      imgHtml += `<div class="c-dots">${imgs.map((_,i)=>`<div class="dot${i===0?' on':''}" data-i="${i}"></div>`).join('')}</div>`;
    }
    imgHtml += `<a href="${imgs[0]}" target="_blank" class="img-link" referrerpolicy="no-referrer-when-downgrade">🔗</a>`;
  } else {
    imgHtml = `<div class="no-img"><span style="font-size:1.8rem">📷</span><p style="font-size:.6rem;text-transform:uppercase">Sin imagen</p></div>`;
  }

  // Size table with qty inputs
  const sizeRows = sizes.map(sz => {
    const kv = k08[sz] || 0;
    const wv = wh[sz] || 0;
    const qv = sizeQtys[sz] || '';
    return `<tr>
      <td class="td-sz">${sz}</td>
      <td class="td-k">${kv||'-'}</td>
      <td class="td-w">${wv||'-'}</td>
      <td><input class="qty-size-input" type="number" min="0" placeholder="0" value="${qv}"
        data-key="${item.key}" data-size="${sz}"></td>
    </tr>`;
  }).join('');

  return `<div class="card${isSel?' sel':''}" data-key="${item.key}">
    <div class="chk">${isSel?'✓':''}</div>
    <div class="img-wrap" data-idx="0">${imgHtml}</div>
    <div class="info">
      <div class="art-row"><div class="art-id">${item.articulo}</div><div class="col-badge">${item.color}</div></div>
      <div class="descri"><b>${item.descri_col}</b> · ${item.descri_art}</div>
      <div class="stk-summary">
        <div class="stk-pill k"><div class="pn">${k08t}</div><div class="pl">K08</div></div>
        <div class="stk-pill w"><div class="pn">${wht}</div><div class="pl">Warehouse</div></div>
      </div>
      <table class="size-tbl">
        <thead><tr><th>Talla</th><th class="k-col">K08</th><th class="w-col">WH</th><th class="q-col">Pedido</th></tr></thead>
        <tbody>${sizeRows}</tbody>
      </table>
    </div>
  </div>`;
}



function render() {
  const items = getFiltered();
  const content = document.getElementById('content');
  if (!items.length) { content.innerHTML = '<div class="no-results">Sin resultados.</div>'; updateBottom([]); return; }
  const byFam = {};
  items.forEach(i => { (byFam[i.familia] = byFam[i.familia]||[]).push(i); });
  const fams = Object.keys(byFam).sort();
  content.innerHTML = fams.map(f => {
    const cnt = byFam[f].length;
    const allSel = cnt > 0 && byFam[f].every(i => S.selected.has(i.key));
    return `<div class="sec-hdr">
      <span class="sec-name">${f}</span>
      <span class="sec-cnt">${cnt} artículo${cnt!==1?'s':''}</span>
      <button class="sbtn sbtn-sel${allSel?' all':''}" data-fam="${f.replace(/"/g,'&quot;')}">${allSel?'✓ Todos':'☐ Seleccionar todos'}</button>
      <button class="sbtn sbtn-del" data-fam="${f.replace(/"/g,'&quot;')}">🗑 Eliminar</button>
    </div>
    <div class="grid">${byFam[f].map(renderCard).join('')}</div>`;
  }).join('');
  updateBottom(items);
}

function updateBottom(items) {
  const k = items.reduce((a,i) => a + Object.values(i.stock_k08||{}).reduce((x,y)=>x+y,0), 0);
  const w = items.reduce((a,i) => a + Object.values(i.stock_warehouse||{}).reduce((x,y)=>x+y,0), 0);
  document.getElementById('totR').textContent = items.length;
  document.getElementById('totK').textContent = k.toLocaleString();
  document.getElementById('totW').textContent = w.toLocaleString();
  updateToolbar();
}

// CAROUSEL
function carouselMove(wrap, d) { const imgs = wrap.querySelectorAll('img'); carouselGoto(wrap, ((+wrap.dataset.idx||0)+d+imgs.length)%imgs.length); }
function carouselGoto(wrap, idx) {
  const imgs = wrap.querySelectorAll('img'), dots = wrap.querySelectorAll('.dot');
  imgs.forEach((img,i) => img.classList.toggle('on', i===idx));
  dots.forEach((d,i) => d.classList.toggle('on', i===idx));
  wrap.dataset.idx = idx;
  const lnk = wrap.querySelector('.img-link'); if (lnk && imgs[idx]) lnk.href = imgs[idx].src;
}
</script>
