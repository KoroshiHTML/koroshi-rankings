        ];

        function render() {
            items = saleData;
            const container = document.getElementById('container');
            
            container.innerHTML = `
                <div class="grid">
                    ${items.map(item => `
                        <div class="card">
                            <div class="image-wrapper">
                                <img src="https://koroshishop.com/cdn/shop/files/${item.referencia}_1.jpg" alt="${item.referencia}" class="image" onerror="this.style.display='none'">
                                <div class="placeholder">No imagen</div>
                            </div>
                            <div class="info">
                                <div class="familia">${item.familia}</div>
                                <div class="article">${item.article}</div>
                                <div class="color">${item.referencia}</div>
                                <div class="sexo">${item.sexo}</div>
                                <div class="prices">
                                    <div class="price-row">
                                        <span class="price-label">PVP:</span>
                                        <span class="precio-actual">€${item.precio_actual.toFixed(2)}</span>
                                    </div>
                                    <div class="price-row">
                                        <span class="price-label">Rebaja:</span>
                                        <span class="precio-rebaja">€${item.precio_rebaja.toFixed(2)}</span>
                                        <span class="descuento">${(Math.abs(item.descuento) * 100).toFixed(0)}%</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Load on page ready
        document.addEventListener('DOMContentLoaded', render);

        // Download Excel function
        document.getElementById('download-btn').addEventListener('click', function() {
            try {
                // Prepare data for Excel
                const excelData = items.map(item => ({
                    'Artículo': item.article,
                    'Familia': item.familia,
                    'Sexo': item.sexo,
                    'Referencia': item.referencia,
                    'Color': item.color,
                    'Precio Actual': item.precio_actual,
                    'Precio Rebaja': item.precio_rebaja,
                    'Descuento %': (Math.abs(item.descuento) * 100).toFixed(2)
                }));

                // Create workbook
                const ws = XLSX.utils.json_to_sheet(excelData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Midseason Sale");

                // Set column widths
                ws['!cols'] = [
                    { wch: 15 },
                    { wch: 25 },
                    { wch: 12 },
                    { wch: 20 },
                    { wch: 10 },
                    { wch: 15 },
                    { wch: 15 },
                    { wch: 12 }
                ];

                // Write file
                XLSX.writeFile(wb, "Midseason_Sale_V26.xlsx");
                console.log('Excel file downloaded successfully');
            } catch (error) {
                console.error('Download error:', error);
                alert('Error downloading file. Please try again.');
            }
        });

        // Download CSV function
        document.getElementById('download-csv-btn').addEventListener('click', function() {
            try {
                const headers = ['Artículo', 'Familia', 'Sexo', 'Referencia', 'Color', 'Precio Actual', 'Precio Rebaja', 'Descuento %'];
                
                let csv = headers.join(';') + '\n';
                
                items.forEach(item => {
                    csv += [
                        item.article,
                        item.familia,
                        item.sexo,
                        item.referencia,
                        item.color,
                        item.precio_actual,
                        item.precio_rebaja,
                        (Math.abs(item.descuento) * 100).toFixed(2)
                    ].join(';') + '\n';
                });

                // Create blob and download
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', 'Midseason_Sale_V26.csv');
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                console.log('CSV file downloaded successfully');
            } catch (error) {
                console.error('Download error:', error);
                alert('Error downloading file. Please try again.');
            }
        });
    </script>

    <script>
        const correctPassword = "koroshi2026";
        
        function checkPassword() {
            const input = document.getElementById('password-input').value;
            if (input === correctPassword) {
                localStorage.setItem('koroshi-dashboard-auth', 'true');
                document.getElementById('password-overlay').style.display = 'none';
            } else {
                alert('Incorrect password. Please try again.');
                document.getElementById('password-input').value = '';
            }
        }
        
        document.getElementById('password-input').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') checkPassword();
        });
        
        window.addEventListener('load', function() {
            if (localStorage.getItem('koroshi-dashboard-auth') === 'true') {
                document.getElementById('password-overlay').style.display = 'none';
            }
        });
