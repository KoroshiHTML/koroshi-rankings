const TABS = [
  { key: 'ALL', label: '👥 TODOS' },
  { key: 'HOMBRE', label: '👨 HOMBRE' },
  { key: 'MUJER', label: '👩 MUJER' },
  { key: 'BOY', label: '👦 NIÑO' },
  { key: 'UNISEX', label: '♻️ UNISEX' }
];

let currentTab = 'ALL';
let searchTerm = '';

function getFiltered() {
  let data = currentTab === 'ALL' ? vmData : vmData.filter(i => i.sexo === currentTab);
  if (searchTerm) {
    const t = searchTerm.toLowerCase();
    data = data.filter(i =>
      i.article.toLowerCase().includes(t) ||
      i.familia.toLowerCase().includes(t) ||
      i.referencia.toLowerCase().includes(t)
    );
  }
  return data;
}

function groupByFamily(items) {
  const groups = {};
  items.forEach(i => { (groups[i.familia] = groups[i.familia] || []).push(i); });
  // within family, sort by lowest price first
  Object.keys(groups).forEach(f => groups[f].sort((a,b) => a.precio - b.precio));
  return Object.keys(groups).sort().map(f => ({ familia: f, items: groups[f] }));
}

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  TABS.forEach(t => {
    const n = (t.key === 'ALL' ? vmData : vmData.filter(i => i.sexo === t.key)).length;
    if (t.key !== 'ALL' && n === 0) return;
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (t.key === currentTab ? ' active' : '');
    btn.textContent = t.label + ' (' + n + ')';
    btn.onclick = () => { currentTab = t.key; render(); };
    el.appendChild(btn);
  });
}

function cardHTML(item) {
  return `
    <div class="card">
      <div class="image-wrapper">
        <div class="placeholder">Sin imagen</div>
        <img src="https://koroshishop.com/cdn/shop/files/${item.referencia}_1.jpg" alt="${item.referencia}" class="image" onerror="this.style.display='none'">
      </div>
      <div class="info">
        <div class="familia">${item.familia}</div>
        <div class="article">${item.article}</div>
        <div class="color">${item.referencia}</div>
        <div class="sexo">${item.sexo}</div>
        <div class="precio">€${item.precio.toFixed(2)}</div>
      </div>
    </div>`;
}

function render() {
  renderTabs();
  const data = getFiltered();

  document.getElementById('s-count').textContent = data.length;
  const fams = new Set(data.map(i => i.familia));
  document.getElementById('s-fam').textContent = fams.size;
  if (data.length) {
    document.getElementById('s-min').textContent = '€' + Math.min(...data.map(i=>i.precio)).toFixed(2);
    document.getElementById('s-max').textContent = '€' + Math.max(...data.map(i=>i.precio)).toFixed(2);
  } else {
    document.getElementById('s-min').textContent = '—';
    document.getElementById('s-max').textContent = '—';
  }

  const groups = groupByFamily(data);
  let html = '';
  groups.forEach(g => {
    const minP = Math.min(...g.items.map(i=>i.precio));
    const maxP = Math.max(...g.items.map(i=>i.precio));
    const rango = minP === maxP ? `€${minP.toFixed(2)}` : `€${minP.toFixed(2)} – €${maxP.toFixed(2)}`;
    html += `
      <div class="family-section">
        <div class="family-header">
          <span class="family-name">${g.familia}</span>
          <span class="family-meta">${g.items.length} art. · ${rango}</span>
        </div>
        <div class="grid">${g.items.map(cardHTML).join('')}</div>
      </div>`;
  });
  document.getElementById('results').innerHTML = html || '<div class="loading">Sin artículos que coincidan con la búsqueda</div>';
}

function exportExcel() {
  const data = getFiltered();
  const cols = ['temporada','sexo','familia','article','color','referencia','precio'];
  const headers = ['Temporada','Sexo','Familia','Articulo','Color','Referencia','Precio'];
  if (typeof XLSX !== 'undefined' && XLSX.utils && XLSX.writeFile) {
    try {
      const rows = data.map(i => { const o={}; cols.forEach((c,idx)=>o[headers[idx]]=i[c]); return o; });
      const ws = XLSX.utils.json_to_sheet(rows, { header: headers });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, currentTab);
      XLSX.writeFile(wb, 'Koroshi_VM_V26_' + currentTab + '.xlsx');
      return;
    } catch (e) { console.error('XLSX fallo, usando alternativa:', e); }
  }
  let table = '<table border="1"><tr>' + headers.map(h=>'<th>'+h+'</th>').join('') + '</tr>';
  data.forEach(i => { table += '<tr>' + cols.map(c=>'<td>'+(i[c]===undefined?'':i[c])+'</td>').join('') + '</tr>'; });
  table += '</table>';
  const out = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body>'+table+'</body></html>';
  const blob = new Blob(['\ufeff', out], { type: 'application/vnd.ms-excel' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Koroshi_VM_V26_' + currentTab + '.xls';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function exportCSV() {
  const data = getFiltered();
  const csv = [['Temporada','Sexo','Familia','Articulo','Color','Referencia','Precio'].join(',')]
    .concat(data.map(i => [i.temporada,i.sexo,i.familia,i.article,i.color,i.referencia,i.precio].join(',')))
    .join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Koroshi_VM_V26_' + currentTab + '.csv';
  a.click();
}

document.getElementById('download-btn').addEventListener('click', exportExcel);
document.getElementById('download-csv-btn').addEventListener('click', exportCSV);
document.getElementById('search').addEventListener('input', e => { searchTerm = e.target.value; render(); });
window.addEventListener('load', render);
