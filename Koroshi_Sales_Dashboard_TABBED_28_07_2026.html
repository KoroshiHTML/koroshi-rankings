  { key: 'ALL', label: '👥 TODOS' },
  { key: 'REBAJAS50', label: '🔥 REBAJAS 50%+' },
  { key: 'REBAJAS60', label: '🔥 REBAJAS 60%+' },
  { key: 'REBAJAS70', label: '🔥 REBAJAS 70%+' },
  { key: 'HOMBRE', label: '👨 HOMBRE' },

  { key: 'BOY', label: '👦 NIÑO' },
  { key: 'GIRL', label: '👧 NIÑA' },
  { key: 'UNISEX', label: '♻️ UNISEX' }
];

let currentTab = 'ALL';

function getFiltered(tab) {
  if (tab === 'ALL') return saleData;
  if (tab === 'REBAJAS50') return saleData.filter(i => i.discount_percent >= 50);
  if (tab === 'REBAJAS60') return saleData.filter(i => i.discount_percent >= 60);
  if (tab === 'REBAJAS70') return saleData.filter(i => i.discount_percent >= 70);
  return saleData.filter(i => i.sexo === tab);
}

// Group items by family, and within each family sort:
// 1) discount >= 50% first, 2) then by lowest rebaja price first.
function groupByFamily(items) {
  const groups = {};
  items.forEach(i => {
    if (!groups[i.familia]) groups[i.familia] = [];
    groups[i.familia].push(i);
  });
  Object.keys(groups).forEach(fam => {
    groups[fam].sort((a, b) => {
      const aHigh = a.discount_percent >= 50 ? 1 : 0;
      const bHigh = b.discount_percent >= 50 ? 1 : 0;
      if (aHigh !== bHigh) return bHigh - aHigh;        // 50%+ first
      return a.precio_rebaja - b.precio_rebaja;          // then lowest price first
    });
  });
  // Return family names sorted alphabetically for stable layout
  return Object.keys(groups).sort().map(fam => ({ familia: fam, items: groups[fam] }));
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  TABS.forEach(t => {
    const n = getFiltered(t.key).length;
    if (t.key !== 'ALL' && n === 0) return;
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (t.key === currentTab ? ' active' : '');
    btn.textContent = t.label + ' (' + n + ')';
    btn.onclick = () => { currentTab = t.key; render(); };
    tabsEl.appendChild(btn);
  });
}

function cardHTML(item) {
  const cardClass = item.discount_percent >= 60 ? 'disc-60' : item.discount_percent >= 50 ? 'disc-50' : '';
  const badgeClass = item.discount_percent >= 60 ? 'd60' : item.discount_percent >= 50 ? 'd50' : '';
  return `
    <div class="card ${cardClass}">
      <div class="image-wrapper">
        <div class="placeholder">No imagen</div>
        <img src="https://koroshishop.com/cdn/shop/files/${item.referencia}_1.jpg" alt="${item.referencia}" class="image" onerror="this.style.display='none'">
      </div>
      <div class="info">
        <div class="familia">${item.familia}</div>
        <div class="article">${item.article}</div>
        <div class="color">${item.referencia}</div>
        <div class="sexo">${item.sexo}</div>
        <div class="prices">
          <div class="price-row"><span class="price-label">PVP:</span><span class="precio-actual">€${item.precio_actual.toFixed(2)}</span></div>
          <div class="price-row"><span class="price-label">Rebaja:</span><span class="precio-rebaja">€${item.precio_rebaja.toFixed(2)}</span><span class="descuento ${badgeClass}">${item.discount_percent.toFixed(0)}%</span></div>
        </div>
      </div>
    </div>`;
}

function render() {
  renderTabs();
  const data = getFiltered(currentTab);
  const container = document.getElementById('grid');

  // stats
  const avg = data.length ? (data.reduce((s,i)=>s+i.discount_percent,0)/data.length).toFixed(1) : '0';
  const c50 = data.filter(i=>i.discount_percent>=50).length;
  const c60 = data.filter(i=>i.discount_percent>=60).length;
  document.getElementById('s-count').textContent = data.length;
  document.getElementById('s-avg').textContent = avg + '%';
  document.getElementById('s-50').textContent = c50;
  document.getElementById('s-60').textContent = c60;

  // Group by family with the requested sorting
  const groups = groupByFamily(data);
  let html = '';
  groups.forEach(g => {
    const fam50 = g.items.filter(i => i.discount_percent >= 50).length;
    const minPrice = Math.min(...g.items.map(i => i.precio_rebaja));
    html += `
      <div class="family-section">
        <div class="family-header">
          <span class="family-name">${g.familia}</span>
          <span class="family-meta">${g.items.length} art. · desde €${minPrice.toFixed(2)}${fam50 ? ` · <span class="fam-50">${fam50} con 50%+</span>` : ''}</span>
        </div>
        <div class="grid">${g.items.map(cardHTML).join('')}</div>
      </div>`;
  });
  container.innerHTML = html || '<div class="loading">Sin artículos</div>';
}

function exportExcel() {
  const data = getFiltered(currentTab);
  const cols = ['article','color','referencia','familia','sexo','precio_actual','precio_rebaja','discount_percent'];
  const headers = ['Articulo','Color','Referencia','Familia','Sexo','PVP','Rebaja','Descuento%'];
  if (typeof XLSX !== 'undefined' && XLSX.utils && XLSX.writeFile) {
    try {
      const rows = data.map(i => { const o = {}; cols.forEach((c, idx) => o[headers[idx]] = i[c]); return o; });
      const ws = XLSX.utils.json_to_sheet(rows, { header: headers });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, currentTab);
      XLSX.writeFile(wb, 'Koroshi_Rebajas_28_07_' + currentTab + '.xlsx');
      return;
    } catch (e) { console.error('XLSX export failed, using fallback:', e); }
  }
  let table = '<table border="1"><tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr>';
  data.forEach(i => { table += '<tr>' + cols.map(c => '<td>' + (i[c] === undefined ? '' : i[c]) + '</td>').join('') + '</tr>'; });
  table += '</table>';
  const out = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body>' + table + '</body></html>';
  const blob = new Blob(['\ufeff', out], { type: 'application/vnd.ms-excel' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Koroshi_Rebajas_28_07_' + currentTab + '.xls';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function exportCSV() {
  const data = getFiltered(currentTab);
  const csv = [['Articulo','Color','Referencia','Familia','Sexo','PVP','Rebaja','Descuento%'].join(',')]
    .concat(data.map(i => [i.article,i.color,i.referencia,i.familia,i.sexo,i.precio_actual,i.precio_rebaja,i.discount_percent].join(',')))
    .join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Koroshi_Rebajas_28_07_' + currentTab + '.csv';
  a.click();
}

document.getElementById('download-btn').addEventListener('click', exportExcel);
document.getElementById('download-csv-btn').addEventListener('click', exportCSV);
window.addEventListener('load', render);
</script>
</body>
